<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root { --accent: #1a73e8; --muted: #5f6368; --line: #dadce0; --warn: #b06000; --ok: #188038; }
    * { box-sizing: border-box; }
    body { font: 13px/1.45 Roboto, Arial, sans-serif; color: #202124; margin: 0; padding: 12px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
    label { display: block; margin: 6px 0 2px; }
    input[type=text], input[type=url], select, textarea {
      width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
    .check input { margin-top: 3px; }
    .hint { color: var(--muted); font-size: 12px; }
    .card { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
    .issues { margin: 6px 0 0; padding-left: 18px; color: var(--warn); }
    .ok { color: var(--ok); }
    button { font: inherit; border-radius: 4px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: #fff; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; font-weight: 500; margin-top: 14px; }
    button:disabled { opacity: .6; cursor: default; }
    details summary { cursor: pointer; color: var(--accent); margin: 8px 0; }
    #result a { color: var(--accent); }
    #result li { margin: 4px 0; }
    .error { color: #c5221f; }
    .copybox { display: flex; gap: 6px; margin-top: 6px; }
    .copybox input { flex: 1; }
  </style>
</head>
<body>
  <div id="loading" class="hint">Loading…</div>

  <div id="app" hidden>
    <h2>Product</h2>
    <label for="productName">Product name</label>
    <input type="text" id="productName">

    <h2>Print check</h2>
    <div class="card" id="check"></div>
    <button id="recheck" style="margin-top:6px">Re-run check</button>

    <h2>Create</h2>
    <div class="check"><input type="checkbox" id="pdf" checked><label for="pdf">Print-ready PDF</label></div>
    <div class="check"><input type="checkbox" id="docx" checked><label for="docx">Editable Word file (.docx)</label></div>
    <div class="check"><input type="checkbox" id="editableLink" checked>
      <label for="editableLink">Editable Google Doc link<br><span class="hint">Shares the master copy view-only and adds a "make a copy" link to the Read Me page.</span></label></div>
    <div class="check"><input type="checkbox" id="readMe" checked><label for="readMe">Read Me First page (thank you + terms of use)</label></div>
    <div class="check"><input type="checkbox" id="preview" checked><label for="preview">Watermarked preview PDF</label></div>
    <div class="check"><input type="checkbox" id="zip" checked><label for="zip">ZIP everything for TPT upload</label></div>

    <label for="pageSize">Page size for the printable</label>
    <select id="pageSize">
      <option value="LETTER">US Letter (8.5 × 11 in)</option>
      <option value="A4">A4</option>
      <option value="KEEP">Keep the document's size</option>
    </select>

    <details>
      <summary>Shop details &amp; terms of use</summary>
      <label for="shopName">Shop name</label>
      <input type="text" id="shopName" placeholder="e.g. Bright Minds Classroom">
      <label for="storeUrl">Store link (optional)</label>
      <input type="url" id="storeUrl" placeholder="https://www.teacherspayteachers.com/store/…">
      <label for="thankYou">Thank-you note</label>
      <textarea id="thankYou" style="min-height:70px"></textarea>
      <label for="terms">Terms of use</label>
      <textarea id="terms"></textarea>
      <p class="hint">Saved for every document, so these only need to be set once.</p>
    </details>

    <button class="primary" id="build">Build TPT package</button>
    <div id="status" class="hint" style="margin-top:8px"></div>
    <div id="result"></div>
  </div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var SETTING_FIELDS = ['shopName', 'storeUrl', 'thankYou', 'terms', 'pageSize'];
  var OUTPUTS = ['pdf', 'docx', 'editableLink', 'readMe', 'preview', 'zip'];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderCheck(check) {
    var html = '<div><strong>Page size:</strong> ' + esc(check.pageSize) + '</div>';
    if (!check.issues.length) {
      html += '<div class="ok">✓ No print problems found.</div>';
    } else {
      html += '<ul class="issues">' + check.issues.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
    }
    $('check').innerHTML = html;
  }

  function fail(err) {
    $('status').innerHTML = '<span class="error">' + esc(err && err.message ? err.message : err) + '</span>';
    $('build').disabled = false;
    $('recheck').disabled = false;
  }

  google.script.run.withSuccessHandler(function (state) {
    $('productName').value = state.docName;
    SETTING_FIELDS.forEach(function (f) { $(f).value = state.settings[f] || ''; });
    if (!state.settings.pageSize) $('pageSize').value = 'LETTER';
    renderCheck(state.check);
    $('loading').hidden = true;
    $('app').hidden = false;
  }).withFailureHandler(function (e) {
    $('loading').innerHTML = '<span class="error">' + esc(e.message) + '</span>';
  }).getInitialState();

  $('recheck').onclick = function () {
    $('recheck').disabled = true;
    google.script.run.withSuccessHandler(function (c) {
      renderCheck(c);
      $('recheck').disabled = false;
    }).withFailureHandler(fail).runPrintCheck();
  };

  $('build').onclick = function () {
    var opts = { productName: $('productName').value, settings: {} };
    SETTING_FIELDS.forEach(function (f) { opts.settings[f] = $(f).value; });
    OUTPUTS.forEach(function (o) { opts[o] = $(o).checked; });

    $('build').disabled = true;
    $('result').innerHTML = '';
    $('status').textContent = 'Building package… this can take up to a minute for long documents.';

    google.script.run.withSuccessHandler(function (r) {
      $('build').disabled = false;
      $('status').innerHTML = '<span class="ok">✓ Package ready.</span>';
      var html = '<p><a href="' + esc(r.folderUrl) + '">Open folder: ' + esc(r.folderName) + '</a></p><ul>';
      r.outputs.forEach(function (o) {
        html += '<li><a href="' + esc(o.url) + '">' + esc(o.label) + '</a></li>';
      });
      html += '</ul>';
      if (r.copyUrl) {
        html += '<div class="hint">Make-a-copy link for buyers:</div>' +
          '<div class="copybox"><input type="text" id="copyUrl" readonly value="' + esc(r.copyUrl) + '">' +
          '<button id="copyBtn">Copy</button></div>';
      }
      $('result').innerHTML = html;
      if (r.copyUrl) {
        $('copyBtn').onclick = function () {
          $('copyUrl').select();
          document.execCommand('copy');
          $('copyBtn').textContent = 'Copied';
        };
      }
    }).withFailureHandler(fail).buildPackage(opts);
  };
</script>
</body>
</html>
